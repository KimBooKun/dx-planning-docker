name: build docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dx-planning:1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/dx-planning:latest

      - name: image size
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dx-planning:1.0
          docker images ${{ secrets.DOCKERHUB_USERNAME }}/dx-planning:1.0
